name: PrimeGuard
version: '1.0.0'
main: com.primesmp.guard.PrimeGuard
api-version: '1.20'
author: PrimeSMP
description: Lightweight anti-cheat and staff tool panel

commands:
  staff:
    aliases: [staffpanel, stafftools]
    description: Open the PrimeGuard staff panel
    usage: /staff
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player>
  stafftp:
    description: Teleport to a player as staff
    usage: /stafftp <player>
  rtpstaff:
    description: Teleport yourself to a safe random location
    usage: /rtpstaff
  stashspawn:
    description: Spawn a configured staff stash at your location
    usage: /stashspawn
  orespawn:
    description: Spawn an ore vein at the block you are looking at
    usage: /orespawn [ore]

permissions:
  primeguard.staff:
    default: op
  primeguard.alerts:
    default: op
  primeguard.bypass:
    default: op
