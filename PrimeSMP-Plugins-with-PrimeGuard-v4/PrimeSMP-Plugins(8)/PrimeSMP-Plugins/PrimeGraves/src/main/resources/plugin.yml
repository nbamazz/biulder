name: PrimeGraves
version: '1.0.0'
main: com.primesmp.graves.PrimeGraves
api-version: '1.20'
author: PrimeSMP
description: Death chests so items aren't lost or looted on death

commands:
  graves:
    description: List the locations of your active graves
    usage: /<command>

permissions:
  primegraves.admin:
    description: Allows opening any player's grave immediately
    default: op
