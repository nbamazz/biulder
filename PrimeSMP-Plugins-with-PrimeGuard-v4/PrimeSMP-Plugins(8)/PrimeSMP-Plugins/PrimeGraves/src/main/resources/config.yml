# PrimeGraves configuration
#
# When a player dies, their dropped items are placed into a chest at the
# death location instead of scattering on the ground (and instead of being
# lost, or looted by whoever killed them, during the protection window).

# Minutes only the owner (and admins) can open the grave. After this, anyone
# can loot it. Set to a huge number to effectively make it owner-only forever.
protect-minutes: 5

# Minutes before an unopened/non-empty grave disappears entirely. Any items
# still inside are dropped on the ground at that point (not deleted).
expire-minutes: 60

# Broadcast a message to the player when they get a grave.
notify-message: "&eYour items were placed in a grave at your death location."

# If true, deleting the last item from a grave removes the chest immediately
# instead of waiting for expire-minutes.
remove-when-emptied: true
