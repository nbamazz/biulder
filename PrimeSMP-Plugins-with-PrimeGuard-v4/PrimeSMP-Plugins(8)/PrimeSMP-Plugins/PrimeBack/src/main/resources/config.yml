# PrimeBack configuration

# Record your death location so /back can return you to where you died.
save-on-death: true

# Record your location before other teleports (warps, homes, /tpa, /rtp, /spawn)
# so /back can undo them.
save-on-teleport: true

# Seconds of standing still required before /back triggers (0 = instant).
warmup-seconds: 3

# Seconds between uses of /back.
cooldown-seconds: 5
