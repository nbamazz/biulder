name: Build PrimeBack
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build with Maven
        run: |
          POM_PATH="$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -path '*/target' -prune -o -name pom.xml -print -quit)"
          if [ -z "$POM_PATH" ]; then
            echo "Error: No pom.xml was found in this repository. Add the project files or check out the correct repository."
            exit 1
          fi
          echo "Building Maven project: $POM_PATH"
          mvn -B -f "$POM_PATH" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: PrimeBack-jar
          path: '**/target/PrimeBack.jar'
          if-no-files-found: error
