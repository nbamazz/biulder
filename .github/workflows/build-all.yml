name: Build All PrimeSMP Plugins

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build every Maven plugin
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' pom; do
            echo "::group::Building ${pom%/pom.xml}"
            mvn -B -f "$pom" clean package
            echo "::endgroup::"
          done < <(find 'PrimeSMP-Plugins(8)/PrimeSMP-Plugins' -name pom.xml -print0)
      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: PrimeSMP-plugins
          path: '**/target/*.jar'
          if-no-files-found: error
