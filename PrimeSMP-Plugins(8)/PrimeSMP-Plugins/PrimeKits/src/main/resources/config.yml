# PrimeKits configuration
#
# Each kit needs:
#   display        - shown in /kit list
#   cooldown-hours  - hours between claims (0 = one-time only, see one-time below)
#   one-time        - if true, can only ever be claimed once per player, ignoring cooldown
#   permission      - optional; if set, player needs this permission to claim it
#   items           - list of "MATERIAL:AMOUNT" (Bukkit Material enum names)
#
# Overflow items that don't fit in the player's inventory are dropped on
# the ground at their feet rather than lost.

kits:
  starter:
    display: "&aStarter Kit"
    one-time: true
    cooldown-hours: 0
    items:
      - "WOODEN_SWORD:1"
      - "WOODEN_PICKAXE:1"
      - "WOODEN_AXE:1"
      - "BREAD:16"
      - "OAK_LOG:8"

  daily:
    display: "&bDaily Kit"
    one-time: false
    cooldown-hours: 24
    items:
      - "COOKED_BEEF:16"
      - "TORCH:32"
      - "IRON_INGOT:4"

  pvp:
    display: "&cPvP Kit"
    one-time: false
    cooldown-hours: 12
    permission: "primekits.kit.pvp"
    items:
      - "IRON_SWORD:1"
      - "SHIELD:1"
      - "GOLDEN_APPLE:2"
      - "ARROW:32"
      - "BOW:1"
