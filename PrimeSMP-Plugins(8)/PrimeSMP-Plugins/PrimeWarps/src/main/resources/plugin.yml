name: PrimeWarps
version: '1.0.0'
main: com.primesmp.warps.PrimeWarps
api-version: '1.20'
author: PrimeSMP
description: Named server warps for Prime SMP

commands:
  warp:
    description: Teleport to a named warp
    usage: /<command> <name>
  warps:
    description: List all warps
    usage: /<command>
  setwarp:
    description: Create or update a warp at your current location
    usage: /<command> <name>
  delwarp:
    description: Delete a warp
    usage: /<command> <name>

permissions:
  primewarps.use:
    description: Allows using /warp and /warps
    default: true
  primewarps.admin:
    description: Allows /setwarp and /delwarp
    default: op
