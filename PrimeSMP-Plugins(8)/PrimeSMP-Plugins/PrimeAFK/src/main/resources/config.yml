# PrimeAFK configuration

# Seconds of no movement, chat, or commands before a player is auto-marked AFK.
afk-threshold-seconds: 300

# Minutes AFK before being kicked. 0 disables auto-kick entirely.
afk-kick-minutes: 30

afk-broadcast: true
afk-message: "&7%player% is now AFK."
back-message: "&7%player% is no longer AFK."
kick-message: "&cKicked for being AFK too long."
