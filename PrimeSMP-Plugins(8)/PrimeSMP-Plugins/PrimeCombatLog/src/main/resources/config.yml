# PrimeCombatLog configuration

# How long (seconds) a player stays "in combat" after hitting or being hit
# by another player. Any PvP hit refreshes the timer for both players.
combat-duration-seconds: 15

# If a tagged player disconnects before combat ends, kill them instantly
# (drops items normally, counts as a real death) instead of letting them
# escape for free.
punish-logout: true

# Broadcast to the whole server when someone combat logs.
broadcast-on-punish: true
broadcast-message: "&c%player% combat logged and paid the price!"

# Show a boss bar (top-of-screen bar) with a combat countdown while tagged.
show-bossbar: true
