name: PrimeSpawn
version: '1.0.0'
main: com.primesmp.spawn.PrimeSpawn
api-version: '1.20'
author: PrimeSMP
description: Server spawn point for Prime SMP

commands:
  spawn:
    description: Teleport to the server spawn
    usage: /<command>
  setspawn:
    description: Set the server spawn to your current location
    usage: /<command>

permissions:
  primespawn.use:
    description: Allows teleporting to spawn with /spawn
    default: true
  primespawn.admin:
    description: Allows setting the spawn point
    default: op
