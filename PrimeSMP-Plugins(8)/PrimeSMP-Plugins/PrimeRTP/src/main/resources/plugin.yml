name: PrimeRTP
version: '1.0.0'
main: com.primesmp.rtp.PrimeRTP
api-version: '1.20'
author: PrimeSMP
description: Random wilderness teleport for Prime SMP

commands:
  rtp:
    aliases: [wild]
    description: Teleport to a random safe location in the wilderness
    usage: /<command>

permissions:
  primertp.use:
    description: Allows using /rtp
    default: true
